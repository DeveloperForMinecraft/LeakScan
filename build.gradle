buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = '1.0.0'
group = 'dev.leakscan'
archivesBaseName = 'leakscan'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'   // sources contain non-ASCII characters
    // source names and line numbers stay in the jar (stack traces remain readable), but local
    // variable tables are dropped — that is a noticeable part of the class file size
    options.debugOptions.debugLevel = 'source,lines'
}

minecraft {
    mappings channel: 'official', version: '1.16.5'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            jvmArg '-Xmx2G'
            mods { leakscan { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.39'
}

jar {
    manifest {
        attributes(["Specification-Title": "leakscan", "Implementation-Title": "leakscan", "Implementation-Version": project.version])
    }
}
jar.finalizedBy('reobfJar')
