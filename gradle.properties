# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Compilation goes through a Java 8 toolchain. If you have several JDKs and auto-detection picks
# the wrong one (you need a FULL 64-bit JDK 8 with tools.jar, not a JRE and not a 32-bit build —
# see the "Building: JDK details (pitfalls)" section in the README), uncomment and set your path:
# org.gradle.java.installations.auto-detect=false
# org.gradle.java.installations.paths=C:/Program Files/Java/jdk8
